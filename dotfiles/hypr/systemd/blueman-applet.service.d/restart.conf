# blueman-applet is the session's BlueZ pairing agent. Without it, pairing a
# device that needs confirmation fails with "No agent available". Keep it alive.
# Installed into ~/.config/systemd/user by scripts/blueman-applet.sh (not stowed:
# stowing a top-level systemd/ dir would make apply.sh back up ~/.config/systemd).
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=always
RestartSec=3
