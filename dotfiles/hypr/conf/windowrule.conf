# -----------------------------------------------------
# Window rules
# -----------------------------------------------------

windowrule {
  name = windowrule-1
  float = on
  match:class = ^(pavucontrol)$
}

windowrule {
  name = windowrule-2
  float = on
  match:class = ^(blueman-manager)$
}

windowrule {
  name = windowrule-3
  float = on
  match:title = ^(nmtui-applet)$
}

windowrule {
  name = windowrule-4
  float = on
  match:title = ^(qalculate-gtk)$
}

windowrule {
  name = windowrule-5
  float = on
  size = (monitor_w*0.8) (monitor_h*0.8)
  center = on
  match:class = ^(dotfiles-floating)$
}


windowrule {
  name = windowrule-6
  float = on
  center = on
  size = (monitor_w*0.4) (monitor_h*0.8)
  match:class = ^(dotfiles-floating-sm)$
}

windowrule {
  name = windowrule-7
  tile = on
  match:title = ^(Microsoft Teams)$
}


# Browser Picture in Picture
windowrule {
  name = windowrule-8
  float = on
  pin = on
  move = ((monitor_w*0.695)) ((monitor_h*0.04))
  match:title = ^(Picture-in-Picture)$
}


# idleinhibit
windowrule {
  name = windowrule-9
  idle_inhibit = fullscreen
  # always = on
  # focus = 0
  fullscreen = on
  match:class = ([window]) # Available modes: none
}


#xwayland related rules
# when moving objects in resolve a large border is produced
# This rule prevents that and serves as a template for any problematic xwayland apps
windowrule {
  name = windowrule-10
  no_blur = on
  match:class = ^(\bresolve\b)$
  match:xwayland = 1
}

# This is a general rule for xwayland apps but can have other consequences
# for one user it impacted EMACs so it's disabled by default
# It's here as a reference or for quick triage of xwayland ap
#windowrule = noblur, xwayland:1

windowrule {
  name = windowrule-11
  float = on
  size = 350 300
  match:class = ^(org.gnome.Calendar)$
}

# windowrule = move (50%-175) 60,class:^(org.gnome.Calendar)$

windowrule {
  name = windowrule-12
  float = on
  size = 700 500
  move = ((monitor_w*1)-900) (60)
  match:class = ^(org.pulseaudio.pavucontrol)$
}

# GhostPen overlay — floating, centered, pinned so it follows the active workspace
# (without pin, show() restores the hidden window to its original workspace, so the
#  overlay stops appearing once you switch workspaces).
# Title-scoped so it does NOT center the bottom overlays (captions/dictation below).
windowrule {
  name = ghostpen
  float = on
  center = on
  pin = on
  match:class = ^([Gg]hostpen)$
  match:title = ^(GhostPen|GhostPen Settings|GhostPen Playground)$
}

# GhostPen bottom overlays — captions bar (900×170) and dictation pill (520×200) dock
# bottom-center, ~6% above the bottom edge (mirrors the app's own placement).
windowrule {
  name = ghostpen-captions
  float = on
  pin = on
  move = (((monitor_w)-900)/2) (((monitor_h)*0.94)-170)
  match:class = ^([Gg]hostpen)$
  match:title = ^(GhostPen Captions)$
}

windowrule {
  name = ghostpen-dictation
  float = on
  pin = on
  move = (((monitor_w)-520)/2) (((monitor_h)*0.94)-200)
  match:class = ^([Gg]hostpen)$
  match:title = ^(GhostPen Dictation)$
}
