# Window behavior settings
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 0
    col.active_border = 0x96CDFBFF
    col.inactive_border = 0x494D64FF
    layout = dwindle
    resize_on_border = true
}

# Window groups (SUPER+G): make the tab bar actually visible.
group {
    col.border_active = $color4
    col.border_inactive = $color0

    groupbar {
        enabled = true
        height = 26
        render_titles = true
        font_family = Fira Sans
        font_size = 12
        gradients = true
        rounding = 6
        gaps_in = 3
        gaps_out = 4
        col.active = $color4
        col.inactive = rgba(494D64E6)
        text_color = $background
        text_color_inactive = $foreground
    }
}
