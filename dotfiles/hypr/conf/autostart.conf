# Import session env into dbus/systemd FIRST, before anything that talks to a
# portal. Without this, xdg-desktop-portal-{hyprland,gtk} are dbus-activated with
# no WAYLAND_DISPLAY, crash ("Couldn't connect to a wayland compositor"), and
# org.freedesktop.portal.Desktop never starts -> 120s timeouts that stall waybar,
# ags, and every GTK app launch (e.g. ghostty). Must be the first exec-once.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# Safety net for the two-compositor setup (sunshine-seat1):
# xdg-desktop-portal-hyprland binds to whichever Hyprland instance owned the
# shared activation env when it was dbus-activated, and never re-attaches. If
# it is already up against a foreign or dead instance, rebind it here — that is
# what spins at ~150% CPU on a hung-up wayland socket. No-op in the normal case.
exec-once = ~/.config/hypr/scripts/portal-rebind.sh

# Start Listeners
exec-once=~/.config/hypr/scripts/listeners.sh --startall

# Starts the Waybar status bar, displaying system information and widgets.
exec-once = ~/.config/hypr/scripts/launchbar.sh

# Launches the Sway Notification Center for displaying desktop notifications.
exec-once = swaync

# Initiates the Hyprland idle management daemon for screen locking and power saving.
exec-once = hypridle

# Sets and manages the desktop wallpaper.
exec-once = hyprpaper

# Screen sharing/recording portal. Launched automatically via dbus activation now
# that the env is imported above, so we no longer start it blind here (doing both
# caused a double-launch race + segfault).
# exec-once = xdg-desktop-portal-hyprland

# Starts the Polkit authentication agent for privilege escalation requests.
exec-once = hyprpolkitagent

# Monitors clipboard for text content and stores it in cliphist.
exec-once = wl-paste --type text --watch cliphist store

# Monitors clipboard for image content and stores it in cliphist.
exec-once = wl-paste --type image --watch cliphist store

# Initializes the Starship prompt for Bash, customizing the shell prompt appearance.
# exec-once = starship init bash

# Another Polkit agent, often used for compatibility with GNOME applications.
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Restores the last set wallpaper on startup.
exec-once = ~/.config/hypr/scripts/wallpaper-restore.sh

# Applies GTK settings and themes.
exec-once = ~/.config/hypr/scripts/gtk.sh

# Runs a user-defined script for additional application autostarts.
exec-once = ~/.config/hypr/scripts/autostart.sh

# Executes a cleanup script, potentially removing temporary files or old logs.
exec-once = ~/.config/hypr/scripts/cleanup.sh

# Start NetworkManager Applet
exec-once = ~/.config/hypr/scripts/nm-applet.sh

# Start Bluetooh Applet
exec-once = ~/.config/hypr/scripts/blueman-applet.sh

# GhostPen — AI text editing overlay daemon (trigger with Ctrl+Shift+A)
# GHOSTPEN_STT_SERVER=1 exposes its whisper model as an OpenAI-compatible STT
# endpoint on 0.0.0.0:8771, so Hermes (in its container) transcribes voice notes
# through GhostPen's GPU whisper. Model = Settings → Captions; override with
# GHOSTPEN_STT_MODEL / GHOSTPEN_STT_BIND.
exec-once = env GHOSTPEN_STT_SERVER=1 ~/.local/bin/ghostpen
