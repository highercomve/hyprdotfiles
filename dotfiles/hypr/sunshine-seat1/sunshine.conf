# Sunshine instance for the isolated seat1 streaming session.
# Runs inside the headless Hyprland (seat1); completely separate from any
# Sunshine you run manually in the main session (different ports and state).

sunshine_name = ridge-seat1

# wlr-screencopy capture of the headless Hyprland instance (WAYLAND_DISPLAY
# is inherited from the compositor via exec-once).
capture = wlr

# The seat1 compositor renders on the AMD iGPU, so encode there too (VCN
# hardware encoder, zero-copy). by-path symlink = stable across boots.
encoder = vaapi
adapter_name = /dev/dri/by-path/pci-0000:11:00.0-render

# Port base 48989 (default is 47989) so a main-session Sunshine can coexist.
# Web UI: https://<host>:48990 — Moonlight host entry: <host>:48989
port = 48989

# Non-default port means the web UI origin must be allowlisted for CSRF.
csrf_allowed_origins = ["https://ridge:48990", "https://localhost:48990", "https://127.0.0.1:48990"]

# Keep all state separate from ~/.config/sunshine (the main-session instance).
file_state = /home/sergiom/.config/sunshine-seat1/state.json
pkey = /home/sergiom/.config/sunshine-seat1/credentials/cakey.pem
cert = /home/sergiom/.config/sunshine-seat1/credentials/cacert.pem
file_apps = /home/sergiom/.config/hypr/sunshine-seat1/apps.json
log_path = /home/sergiom/.config/sunshine-seat1/sunshine.log

# Resize the virtual display to whatever the Moonlight client asks for.
global_prep_cmd = [{"do":"/home/sergiom/.config/hypr/sunshine-seat1/resize.sh","undo":""}]
